# Eight services: four read-only MCP servers, two write MCP servers, and the
# two A2A agents. A shared volume gives the MCP servers a common "cluster" so
# the Operator's restart is visible to the Observer's re-read.
#
# The local LLM is expected on the host (Ollama / llama-server). Containers
# reach it via host.docker.internal (see extra_hosts). Override LLM_* in .env.
#
# Only the Observer publishes a port. The MCP servers and the Operator are
# reachable on the compose network only: none of them authenticates its caller,
# so anything that can open a socket to shell-exec:8202 gets command execution,
# and anything that can reach operator:9301 can drive the write agent directly
# without the Observer ever being involved.

x-llm-env: &llm-env
  LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434/v1}
  LLM_MODEL: ${LLM_MODEL:-gemma3:27b}
  LLM_API_KEY: ${LLM_API_KEY:-local}

x-demo-env: &demo-env
  DEMO_MODE: ${DEMO_MODE:-1}
  DEMO_STATE_FILE: /data/cluster_state.json
  # Containers need to accept connections from their compose-network peers.
  # The code defaults to 127.0.0.1; binding wider is deliberate and lives here.
  MCP_BIND_HOST: 0.0.0.0
  # Optional OpenTelemetry OTLP export (no-op when empty).
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-}

x-host: &host-gateway
  extra_hosts:
    - "host.docker.internal:host-gateway"

x-hardening: &hardening
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true

services:
  # ---- read-only MCP servers (Observer's tools) ----
  k8s-ro:
    build: .
    <<: *hardening
    command: python -m mcp_servers.k8s_readonly
    environment: { <<: *demo-env, PORT: "8101" }
    volumes: [ "cluster-state:/data" ]

  prometheus-alerts:
    build: .
    <<: *hardening
    command: python -m mcp_servers.prometheus_alerts
    environment: { <<: *demo-env, PORT: "8102" }
    volumes: [ "cluster-state:/data" ]

  loki-logs:
    build: .
    <<: *hardening
    command: python -m mcp_servers.loki_logs
    environment: { <<: *demo-env, PORT: "8103" }
    volumes: [ "cluster-state:/data" ]

  tempo-traces:
    build: .
    <<: *hardening
    command: python -m mcp_servers.tempo_traces
    environment: { <<: *demo-env, PORT: "8104" }
    volumes: [ "cluster-state:/data" ]

  # ---- write MCP servers (Operator's tools) ----
  k8s-write:
    build: .
    <<: *hardening
    command: python -m mcp_servers.k8s_write
    environment:
      <<: *demo-env
      PORT: "8201"
      ALLOWED_NAMESPACES: ${ALLOWED_NAMESPACES:-web,payments,staging}
      MAX_REPLICAS: ${MAX_REPLICAS:-20}
    volumes: [ "cluster-state:/data" ]

  shell-exec:
    build: .
    <<: *hardening
    command: python -m mcp_servers.shell_exec
    environment: { <<: *demo-env, PORT: "8202" }
    volumes: [ "cluster-state:/data" ]

  # ---- agents ----
  operator:
    build: .
    command: python -m agents.operator.server
    <<: [ *host-gateway, *hardening ]
    environment:
      <<: [ *llm-env, *demo-env ]
      PORT: "9301"
      OPERATOR_PUBLIC_URL: http://operator:9301
      K8S_WRITE_URL: http://k8s-write:8201/mcp
      SHELL_URL: http://shell-exec:8202/mcp
      REQUIRE_APPROVAL: ${REQUIRE_APPROVAL:-0}
    # Intentionally NOT published: the write agent is reachable from the
    # Observer over the compose network and from nowhere else.
    depends_on: [ k8s-write, shell-exec ]

  observer:
    build: .
    command: python -m agents.observer.server
    <<: [ *host-gateway, *hardening ]
    environment:
      <<: [ *llm-env, *demo-env ]
      PORT: "9300"
      OBSERVER_PUBLIC_URL: http://observer:9300
      OPERATOR_URL: http://operator:9301
      K8S_RO_URL: http://k8s-ro:8101/mcp
      PROMETHEUS_ALERTS_URL: http://prometheus-alerts:8102/mcp
      LOKI_LOGS_URL: http://loki-logs:8103/mcp
      TEMPO_TRACES_URL: http://tempo-traces:8104/mcp
    ports: [ "9300:9300" ]
    depends_on: [ k8s-ro, prometheus-alerts, loki-logs, tempo-traces, operator ]

volumes:
  cluster-state:
