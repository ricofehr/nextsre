# Builds and smoke-tests the single runtime image on every pull request and push,
# and publishes it to GHCR from main and from version tags. Every published image
# carries the full commit SHA, which is what deployments should pin.
name: image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

# Only pull-request builds supersede each other: every push to main must publish
# its own SHA tag, or a deployment pinned to it would never find the image.
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SMOKE_TAG: nextsre:smoke

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ${{ env.SMOKE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the image
        run: |
          set -eu
          uid=$(docker run --rm "$SMOKE_TAG" id -u)
          test "$uid" != 0
          docker run --rm "$SMOKE_TAG" python -c "import kubernetes, services.gateway"
          docker run --rm "$SMOKE_TAG" kubectl version --client
          docker run -d --name gateway -p 127.0.0.1:9302:9302 \
            -e MCP_BIND_HOST=0.0.0.0 "$SMOKE_TAG" python -m services.gateway
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9302/health; then exit 0; fi
            sleep 1
          done
          docker logs gateway
          exit 1

  publish:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long,prefix=
            type=ref,event=branch
            type=semver,pattern={{version}}

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
