[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sre-agents"
version = "0.1.0"
description = "Two collaborating SRE agents (read-only Observer + write Operator) over A2A, with MCP tool servers and a local OpenAI-compatible LLM."
requires-python = ">=3.10"

# Pinned to the exact versions this repo was built and smoke-tested against.
# A2A 1.x is proto-based and changed substantially from 0.x, so do not float it.
dependencies = [
    "a2a-sdk[http-server]==1.1.0",
    "mcp==1.27.2",
    "langgraph==1.2.5",
    "langchain-mcp-adapters==0.3.0",
    "langchain-openai==1.3.2",
    "langchain-core==1.4.7",
    "uvicorn[standard]==0.49.0",
    "starlette==1.3.1",
    "httpx==0.28.1",
]

[project.optional-dependencies]
# Real backends - only needed when DEMO_MODE=0.
real = [
    "kubernetes>=29",
    "psycopg[binary]>=3.1",
    "elasticsearch>=8,<9",
]

[tool.setuptools]
# Flat layout with several top-level packages: list them explicitly so
# setuptools does not bail on "multiple top-level packages discovered".
packages = [
    "common",
    "mcp_servers",
    "agents",
    "agents.observer",
    "agents.operator",
]
