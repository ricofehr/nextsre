[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sre-agents"
version = "0.1.0"
description = "Two collaborating SRE agents (read-only Observer + write Operator) over A2A, with MCP tool servers and a local OpenAI-compatible LLM."
requires-python = ">=3.12"

# Pinned to the exact versions this repo was built and smoke-tested against.
# A2A 1.x is proto-based and changed substantially from 0.x, so do not float it.
#
# mcp 2.x renames FastMCP to MCPServer and moves network binding parameters
# to run(). Pinned to 2.3.0 (latest 2.x release).
dependencies = [
    "a2a-sdk[http-server]==1.3.0",
    "mcp==2.3.0",
    "google-adk[a2a,mcp,openai]==2.14.0",
    "opentelemetry-api==1.45.2",
    "opentelemetry-sdk==1.45.2",
    "opentelemetry-exporter-otlp-proto-grpc==1.45.2",
    "opentelemetry-exporter-otlp-proto-http==1.45.2",
    "uvicorn[standard]==0.54.0",
    "starlette==1.10.0",
    "httpx==0.28.1",
]

[project.optional-dependencies]
# Real backends - only needed when DEMO_MODE=0.
real = [
    "kubernetes>=37,<38",
]
dev = [
    "pytest>=9.2",
    "black>=26.10.1",
    "isort>=9.0",
    "flake8>=7.5",
    "pip-audit>=2.7",
]

# Flat layout with several top-level packages: scope discovery explicitly so
# setuptools does not bail on "multiple top-level packages discovered".
# Patterns rather than a fixed list, because the Dockerfile installs once with
# only pyproject.toml present (to cache the dependency layer) and again after
# COPYing the source: an explicit list makes the first pass fail with
# "package directory 'common' does not exist", while empty discovery is fine.
[tool.setuptools.packages.find]
include = ["common*", "mcp_servers*", "agents*", "services*"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
