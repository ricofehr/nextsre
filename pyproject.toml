[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sre-agents"
version = "0.1.0"
description = "Two collaborating SRE agents (read-only Observer + write Operator) over A2A, with MCP tool servers and a local OpenAI-compatible LLM."
requires-python = ">=3.10"

# Pinned to the exact versions this repo was built and smoke-tested against.
# A2A 1.x is proto-based and changed substantially from 0.x, so do not float it.
#
# mcp stays on 1.x: langchain-mcp-adapters requires mcp<2.0.0, and 2.x renames
# FastMCP to MCPServer. 1.29.1 clears PYSEC-2026-3483 (websocket transport,
# which this repo does not use - it serves streamable-http).
dependencies = [
    "a2a-sdk[http-server]==1.1.2",
    "mcp==1.29.1",
    "langgraph==1.2.11",
    "langchain-mcp-adapters==0.3.2",
    "langchain-openai==1.6.0",
    "langchain-core==1.6.1",
    "uvicorn[standard]==0.52.4",
    "starlette==1.6.0",
    "httpx==0.28.1",
]

[project.optional-dependencies]
# Real backends - only needed when DEMO_MODE=0.
real = [
    "kubernetes>=29",
    "elasticsearch>=8,<9",
]
dev = [
    "pytest>=8",
    "black>=24",
    "isort>=5.13",
    "flake8>=7",
    "pip-audit>=2.7",
]

# Flat layout with several top-level packages: scope discovery explicitly so
# setuptools does not bail on "multiple top-level packages discovered".
# Patterns rather than a fixed list, because the Dockerfile installs once with
# only pyproject.toml present (to cache the dependency layer) and again after
# COPYing the source: an explicit list makes the first pass fail with
# "package directory 'common' does not exist", while empty discovery is fine.
[tool.setuptools.packages.find]
include = ["common*", "mcp_servers*", "agents*"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
